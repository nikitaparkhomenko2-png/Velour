<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#08080a"><title>AutoGlass</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><main class="screen">
<header class="hero-head"><div class="editable title" contenteditable="true" data-key="name">Mercedes-Benz G-Класс AMG</div><div class="plate-wrap"><div class="editable plate" contenteditable="true" data-key="plate">A 001 AA 01</div><span class="chevron">›</span></div></header>
<section class="car-stage"><label class="photo-touch" for="photoInput"><img id="carImage" alt="Автомобиль"><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/*" hidden></label><div class="dots"><i class="active"></i><i></i><i></i><i></i><i></i></div></section>
<section class="glass-card fines-card"><div class="fine-line"><span>Можно проверить штрафы</span><span class="fine-count editable" contenteditable="true" data-key="fines">0</span><span class="chevron">›</span></div></section>
<section class="glass-card price-card"><div class="price-row"><div class="editable price" contenteditable="true" data-key="price">31 738 529 ₽</div><div class="status">Держится</div></div><div class="editable subtitle" contenteditable="true" data-key="priceLabel">Цена Mercedes-Benz G-Класс AMG</div></section>
<section class="glass-card fuel-card"><div class="card-title">Топливо</div><div class="fuel-value-row"><div class="editable fuel-value" contenteditable="true" data-key="fuel">55 л</div><div class="editable fuel-percent" contenteditable="true" data-key="fuelPercent">78%</div></div><div class="fuel-track"><div id="fuelFill" class="fuel-fill"></div></div></section>
<div class="toast" id="toast"></div></main><script src="app.js?v=3"></script></body></html>
