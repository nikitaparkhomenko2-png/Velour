<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Velour">
<meta name="theme-color" content="#08080a">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>Velour</title>
</head>
<body>
<main class="screen">
<header class="hero-head">
  <div class="editable title" contenteditable="true" data-key="name">Mercedes-Benz G-Класс AMG</div>
  <div class="plate-wrap"><div class="editable plate" contenteditable="true" data-key="plate">A 001 AA 01</div><span class="chevron">›</span></div>
</header>

<section class="car-stage">
  <label class="photo-touch" for="photoInput">
    <img id="carImage" alt="Автомобиль">
    <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/*" hidden>
  </label>
  <div class="dots"><i class="active"></i><i></i><i></i><i></i><i></i></div>
</section>

<button class="glass-card fines-card" id="finesOpen" type="button">
  <div class="fine-line">
    <span>Можно проверить штрафы</span>
    <span class="fine-count editable" contenteditable="true" data-key="fines">0</span>
    <span class="chevron">›</span>
  </div>
</button>

<section class="glass-card price-card">
  <div class="price-row"><div class="editable price" contenteditable="true" data-key="price">31 738 529 ₽</div><div class="status">Держится</div></div>
  <div class="editable subtitle" contenteditable="true" data-key="priceLabel">Цена Mercedes-Benz G-Класс AMG</div>
</section>

<section class="glass-card fuel-card">
  <div class="card-title">Топливо</div>
  <div class="fuel-value-row"><div class="editable fuel-value" contenteditable="true" data-key="fuel">55 л</div><div class="editable fuel-percent" contenteditable="true" data-key="fuelPercent">78%</div></div>
  <div class="fuel-track"><div id="fuelFill" class="fuel-fill"></div></div>
</section>
</main>

<div class="modal" id="finesModal" aria-hidden="true">
  <div class="modal-backdrop" data-close-fines></div>
  <section class="fines-sheet">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <div><div class="sheet-title">Штрафы</div><div class="sheet-subtitle" id="finesSubtitle">0 штрафов</div></div>
      <button class="close-btn" type="button" data-close-fines>×</button>
    </div>
    <div class="fine-list" id="fineList"></div>
    <div class="fine-total-row"><span>Всего</span><strong id="fineTotal">0 ₽</strong></div>
    <button class="pay-all" id="payAll" type="button">Оплатить все</button>
  </section>
</div>

<div class="toast" id="toast"></div>
<script src="app.js?v=4"></script>
</body>
</html>
