<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AutoGlass">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>AutoGlass</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen">
    <header class="hero-head">
      <div class="editable title" contenteditable="true" spellcheck="false" data-key="name">Mercedes-Benz G-Класс AMG</div>
      <div class="plate-wrap">
        <div class="editable plate" contenteditable="true" spellcheck="false" data-key="plate">A 001 AA 01</div>
        <span class="chevron">›</span>
      </div>
    </header>

    <section class="car-stage">
      <label class="photo-touch" for="photoInput" aria-label="Выбрать фото автомобиля">
        <img id="carImage" alt="Автомобиль">
        <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/*" hidden>
      </label>
      <div class="dots" id="dots"></div>
    </section>

    <section class="glass-card fines-card">
      <div class="fine-icons">
        <div class="fine-icon police">★</div>
        <div class="fine-icon shield">◆</div>
      </div>
      <div class="fine-line">
        <span>Можно проверить штрафы</span>
        <span class="fine-count editable" contenteditable="true" spellcheck="false" data-key="fines">0</span>
        <span class="chevron">›</span>
      </div>
    </section>

    <section class="quick-card">
      <button class="quick-item" type="button" data-action="fuel">
        <span class="quick-icon fuel">▮</span>
        <span>Топливо</span>
      </button>
      <button class="quick-item" type="button" data-action="parking">
        <span class="quick-icon parking">P</span>
        <span>Парковки</span>
      </button>
      <button class="quick-item" type="button" data-action="transponder">
        <span class="quick-icon transponder">▰</span>
        <span>Транспондер</span>
      </button>
      <button class="quick-item" type="button" data-action="service">
        <span class="quick-icon service">⌕</span>
        <span>Сервис</span>
      </button>
    </section>

    <section class="glass-card price-card">
      <div class="price-row">
        <div class="editable price" contenteditable="true" spellcheck="false" data-key="price">31 738 529 ₽</div>
        <div class="status">Держится</div>
      </div>
      <div class="editable subtitle" contenteditable="true" spellcheck="false" data-key="priceLabel">Цена Mercedes-Benz G-Класс AMG</div>
    </section>

    <section class="glass-card fuel-card">
      <div class="card-title">Топливо</div>
      <div class="fuel-value-row">
        <div class="editable fuel-value" contenteditable="true" spellcheck="false" data-key="fuel">55 л</div>
        <div class="editable fuel-percent" contenteditable="true" spellcheck="false" data-key="fuelPercent">78%</div>
      </div>
      <div class="fuel-track"><div id="fuelFill" class="fuel-fill"></div></div>
    </section>

    <section class="glass-card expenses-card">
      <div class="card-title">Расходы на авто</div>
      <div class="editable expenses" contenteditable="true" spellcheck="false" data-key="expenses">Нет трат в мае</div>
      <div class="empty-track"></div>
    </section>

    <div class="toast" id="toast"></div>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
